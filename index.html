<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little One is Turning One! 🎂</title>
    <style>
        :root {
            --sky-blue: #e0f2fe;
            --cloud-white: #ffffff;
            --pastel-pink: #fbcfe8;
            --pastel-yellow: #fef08a;
            --text-color: #334155;
            --button-color: #38bdf8;
            --button-hover: #0ea5e9;
        }

        body {
            background-color: var(--sky-blue);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Whimsical Floating Background Elements */
        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            background: var(--pastel-pink);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 8s infinite ease-in-out;
            opacity: 0.6;
            z-index: 1;
        }
        .balloon-2 {
            background: var(--pastel-yellow);
            right: 10%;
            animation-duration: 11s;
            animation-delay: 2s;
        }
        .balloon-3 {
            background: #bbf7d0;
            left: 15%;
            bottom: 10%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            50% { transform: translateY(50vh) rotate(10deg); }
            100% { transform: translateY(-20vh) rotate(-10deg); }
        }

        .party-card {
            background-color: var(--cloud-white);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 35px;
            box-sizing: border-box;
            z-index: 10;
            position: relative;
            border: 4px solid #f0f9ff;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .one-badge {
            background-color: var(--pastel-pink);
            color: #db2777;
            font-size: 3.5rem;
            font-weight: bold;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            color: #0284c7;
        }

        .party-details {
            background-color: #f0f9ff;
            padding: 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #475569;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0369a1;
        }

        input[type="text"], select {
            width: 100%;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: var(--text-color);
            padding: 12px;
            font-size: 1rem;
            border-radius: 12px;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--button-color);
            background-color: #fff;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.4);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="balloon"></div>
<div class="balloon balloon-2"></div>
<div class="balloon balloon-3"></div>

<div class="party-card">
    <div class="header">
        <span class="one-badge">1</span>
        <h1>Our Little Boy is Turning One!</h1>
        <div class="party-details">
            📍 <strong>Where:</strong> Saravanaa Bhavan Delta (Buffet)<br>
            📅 <strong>When:</strong> Monday, Sept 7th (Labour Day)<br>
            ⏰ <strong>Time:</strong> 12:00 PM - Lunch Buffet
        </div>
    </div>

    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g., Jane Smith" required>
    </div>

    <div class="form-group">
        <label for="status">Can You Make It?</label>
        <select id="status" required>
            <option value="Attending">Yes, absolutely! 🥳</option>
            <option value="Declined">Sorry, we can't make it 😢</option>
        </select>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="adults">Number of Adults</label>
            <select id="adults">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4+">4+</option>
            </select>
        </div>

        <div class="form-group">
            <label for="kids">Number of Kids</label>
            <select id="kids">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4+">4+</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="ages">Ages of the Kids (For restaurant pricing)</label>
        <input type="text" id="ages" placeholder="e.g., 2, 5 (Leave blank if none)">
    </div>

    <button type="button" id="submitBtn" onclick="transmitToGoogle()">Save My RSVP ✨</button>
    <div id="sysResponse" style="margin-top:20px; display:none; text-align:center; font-weight:600; color:#0369a1; padding:15px; background:#f0f9ff; border-radius:12px;"></div>

    <div class="footer">
        Can't wait to celebrate together! 🎈
    </div>
</div>

<script>
function transmitToGoogle() {
    const btn = document.getElementById('submitBtn');
    const respDiv = document.getElementById('sysResponse');
    
    // 🚨 INCORPORATED DEPLOYED GOOGLE APPS SCRIPT WEB APP URL DIRECTLY BELOW
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzZh7nWttbN89n6MHGEgq42vooaFdrfKKJZ8CvDRO99OqKCn8M5FPT2fFOqlpd5sjCgbw/exec";

    const payload = {
        name: document.getElementById('name').value,
        status: document.getElementById('status').value,
        adults: document.getElementById('adults').value,
        kids: document.getElementById('kids').value,
        ages: document.getElementById('ages').value
    };

    if(!payload.name || payload.name.trim() === "") { 
        alert("Please enter your name so we know who is coming! 😊"); 
        return; 
    }

    btn.innerText = "Saving your spot...";
    btn.disabled = true;

    fetch(googleScriptUrl, {
        method: "POST",
        mode: "no-cors",
        cache: "no-cache",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(() => {
        btn.style.display = "none";
        respDiv.style.display = "block";
        respDiv.innerHTML = "✨ Thank you! Your RSVP has been saved. See you at the buffet! 🍰";
    })
    .catch(err => {
        console.error(err);
        btn.innerText = "Oops! Try clicking again.";
        btn.disabled = false;
    });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little One is Turning One! 🎂</title>
    <style>
        :root {
            --sky-blue: #e0f2fe;
            --cloud-white: #ffffff;
            --pastel-pink: #fbcfe8;
            --pastel-yellow: #fef08a;
            --text-color: #334155;
            --button-color: #38bdf8;
            --button-hover: #0ea5e9;
            --pastel-green: #bbf7d0;
            --pastel-purple: #e9d5ff;
        }

        /* Prevent jumping scrollbars by containing screen area */
        html, body {
            background-color: var(--sky-blue);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Decorative Elements Background Layer */
        .decor-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .decor-item {
            position: absolute;
            opacity: 0.8;
        }

        /* Gentle Sway Animations (No vertical drifting) */
        @keyframes swayLeft {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(4deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes swayRight {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-6deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* Balloons styling */
        .balloon {
            width: 42px;
            height: 52px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        }
        .balloon::after {
            content: "│";
            font-size: 8px;
            position: absolute;
            bottom: -10px;
            left: 18px;
            color: rgba(0,0,0,0.12);
        }

        /* Asset Placements */
        .b1 { left: 4%; top: 8%; background: var(--pastel-pink); animation: swayLeft 6s infinite ease-in-out; }
        .b2 { right: 5%; top: 10%; background: var(--pastel-yellow); animation: swayRight 8s infinite ease-in-out; }
        .b3 { left: 6%; bottom: 8%; background: var(--pastel-green); animation: swayRight 7s infinite ease-in-out; }
        .b4 { right: 4%; bottom: 10%; background: var(--pastel-purple); animation: swayLeft 9s infinite ease-in-out; }
        .b5 { left: 48%; top: 2%; background: #ffedd5; animation: swayLeft 10s infinite ease-in-out; }

        /* Party Hat Accents */
        .party-hat {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 28px solid #fdba74;
        }
        .h1 { left: 8%; top: 45%; transform: rotate(15deg); animation: swayLeft 7s infinite ease-in-out; }
        .h2 { right: 8%; top: 50%; transform: rotate(-20deg); border-bottom-color: #c084fc; animation: swayRight 8s infinite ease-in-out; }

        .star { font-size: 1.4rem; color: var(--pastel-yellow); }
        .s1 { left: 14%; top: 25%; animation: swayLeft 5s infinite ease-in-out; }
        .s2 { right: 15%; bottom: 30%; animation: swayRight 6s infinite ease-in-out; }

        /* Centered White RSVP Card */
        .party-card {
            background-color: var(--cloud-white);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.12);
            width: 92%;
            max-width: 440px;
            padding: 28px;
            box-sizing: border-box;
            z-index: 10;
            position: relative;
            border: 4px solid #f0f9ff;
            max-height: 96vh;
            overflow-y: auto;
        }

        .party-card::-webkit-scrollbar { width: 4px; }
        .party-card::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .one-badge {
            background-color: var(--pastel-pink);
            color: #db2777;
            font-size: 2.6rem;
            font-weight: bold;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: block;
        }

        h1 {
            font-size: 1.35rem;
            margin: 0 0 8px 0;
            color: #0284c7;
        }

        .party-details {
            background-color: #f0f9ff;
            padding: 12px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.45;
            color: #475569;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.88rem;
            color: #0369a1;
        }

        input[type="text"], select {
            width: 100%;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: var(--text-color);
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 12px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--button-color);
            background-color: #fff;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
        }

        #sysResponse {
            margin-top: 12px; 
            display: none; 
            text-align: center; 
            font-weight: 600; 
            color: #0369a1; 
            padding: 12px; 
            background: #f0f9ff; 
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<!-- Background Decorations Canvas -->
<div class="decor-layer">
    <div class="decor-item balloon b1"></div>
    <div class="decor-item balloon b2"></div>
    <div class="decor-item balloon b3"></div>
    <div class="decor-item balloon b4"></div>
    <div class="decor-item balloon b5"></div>
    <div class="decor-item party-hat h1"></div>
    <div class="decor-item party-hat h2"></div>
    <div class="decor-item star s1">⭐</div>
    <div class="decor-item star s2">✨</div>
</div>

<!-- Main RSVP Card -->
<div class="party-card">
    <div class="header">
        <span class="one-badge">1</span>
        <h1>Our Little Boy is Turning One!</h1>
        <div class="party-details">
            📍 <strong>Where:</strong> Saravanaa Bhavan, Delta<br>
            📅 <strong>When:</strong> Monday, Sept 7th<br>
            ⏰ <strong>Time:</strong> 12:00 PM
        </div>
    </div>

    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g., Jane Smith" required>
    </div>

    <div class="form-group">
        <label for="status">Can You Make It?</label>
        <select id="status" required>
            <option value="Attending">Yes, absolutely! 🥳</option>
            <option value="Declined">Sorry, can't make it 😢</option>
        </select>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="adults">Number of Adults</label>
            <select id="adults">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4+">4+</option>
            </select>
        </div>

        <div class="form-group">
            <label for="kids">Number of Kids</label>
            <select id="kids">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4+">4+</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="ages">Ages of the Kids (For restaurant pricing)</label>
        <input type="text" id="ages" placeholder="e.g., 2, 5 (Leave blank if none)">
    </div>

    <button type="button" id="submitBtn" onclick="transmitToGoogle()">Save My RSVP ✨</button>
    <div id="sysResponse"></div>

    <div class="footer">
        Can't wait to celebrate together! 🎈
    </div>
</div>

<script>
function transmitToGoogle() {
    const btn = document.getElementById('submitBtn');
    const respDiv = document.getElementById('sysResponse');
    
    // Incorporated Deployed Google Apps Script Link
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzZh7nWttbN89n6MHGEgq42vooaFdrfKKJZ8CvDRO99OqKCn8M5FPT2fFOqlpd5sjCgbw/exec";

    const payload = {
        name: document.getElementById('name').value,
        status: document.getElementById('status').value,
        adults: document.getElementById('adults').value,
        kids: document.getElementById('kids').value,
        ages: document.getElementById('ages').value
    };

    if(!payload.name || payload.name.trim() === "") { 
        alert("Please enter your name so we know who is coming! 😊"); 
        return; 
    }

    btn.innerText = "Saving your spot...";
    btn.disabled = true;

    fetch(googleScriptUrl, {
        method: "POST",
        mode: "no-cors",
        cache: "no-cache",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(() => {
        btn.style.display = "none";
        respDiv.style.display = "block";
        respDiv.innerHTML = "✨ Thank you! Your RSVP has been saved. See you at the buffet! 🍰";
    })
    .catch(err => {
        console.error(err);
        btn.innerText = "Oops! Try clicking again.";
        btn.disabled = false;
    });
}
</script>
</body>
</html>

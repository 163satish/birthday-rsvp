<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saarth is Turning One! 🎂</title>

    <!-- Google Fonts — playful + readable combo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sky-blue: #e0f2fe;
            --pastel-pink: #fbcfe8;
            --pastel-yellow: #fef08a;
            --text-color: #334155;
            --button-color: #38bdf8;
            --button-hover: #0ea5e9;
            --pastel-green: #bbf7d0;
            --pastel-purple: #e9d5ff;
            --font-display: 'Fredoka', 'Segoe UI', sans-serif;
            --font-body: 'Nunito', 'Segoe UI', sans-serif;
        }

        html, body {
            background: linear-gradient(135deg, #dbeafe 0%, #fbcfe8 30%, #fef9c3 55%, #d9f99d 75%, #e0f2fe 100%);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        @media (max-width: 520px) {
            html, body {
                align-items: flex-start;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* ── Decorative background layer ── */
        .decor-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .decor-item { position: absolute; opacity: 0.8; }

        /* ── Animations ── */
        @keyframes swayLeft {
            0%   { transform: translateY(0) rotate(0deg); }
            25%  { transform: translateY(-14px) rotate(6deg); }
            50%  { transform: translateY(-22px) rotate(3deg); }
            75%  { transform: translateY(-14px) rotate(-4deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes swayRight {
            0%   { transform: translateY(0) rotate(0deg); }
            25%  { transform: translateY(-18px) rotate(-7deg); }
            50%  { transform: translateY(-28px) rotate(-3deg); }
            75%  { transform: translateY(-16px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            50%  { transform: translateY(-32px) rotate(5deg); opacity: 0.95; }
            100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
        }
        @keyframes floatUpAlt {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0.65; }
            50%  { transform: translateY(-26px) rotate(-5deg); opacity: 0.9; }
            100% { transform: translateY(0) rotate(0deg); opacity: 0.65; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.25); }
        }
        @keyframes confettiFall {
            0%   { transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
            25%  { transform: translateY(25vh) rotate(90deg) scale(0.95); opacity: 0.9; }
            50%  { transform: translateY(50vh) rotate(180deg) scale(0.9); opacity: 0.7; }
            75%  { transform: translateY(75vh) rotate(270deg) scale(0.85); opacity: 0.4; }
            100% { transform: translateY(105vh) rotate(360deg) scale(0.8); opacity: 0; }
        }
        @keyframes confettiDrift {
            0%, 100% { margin-left: 0; }
            25% { margin-left: 15px; }
            75% { margin-left: -15px; }
        }
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.06); }
        }
        @keyframes burstFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(60vh) rotate(720deg); opacity: 0; }
        }

        /* ── Confetti pieces ── */
        .confetti {
            position: absolute; top: -12px;
            width: 8px; height: 8px; opacity: 0;
            pointer-events: none; z-index: 0;
            animation: confettiFall linear infinite, confettiDrift ease-in-out infinite;
        }
        .confetti.circle { border-radius: 50%; }
        .confetti.square { border-radius: 2px; }
        .confetti.ribbon { width: 4px; height: 14px; border-radius: 2px; }

        /* ── Balloons ── */
        .balloon {
            width: 42px; height: 52px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        }
        .balloon::after {
            content: "│"; font-size: 8px;
            position: absolute; bottom: -10px; left: 18px;
            color: rgba(0,0,0,0.12);
        }

        .b1  { left: 4%;  top: 8%;     background: var(--pastel-pink);   animation: swayLeft 3s infinite ease-in-out; }
        .b2  { right: 5%; top: 10%;    background: var(--pastel-yellow); animation: swayRight 3.6s infinite ease-in-out; }
        .b3  { left: 6%;  bottom: 8%;  background: var(--pastel-green);  animation: swayRight 3.2s infinite ease-in-out; }
        .b4  { right: 4%; bottom: 10%; background: var(--pastel-purple); animation: swayLeft 4s infinite ease-in-out; }
        .b5  { left: 48%; top: 2%;     background: #ffedd5;             animation: swayLeft 4.4s infinite ease-in-out; }
        .b6  { left: 2%;  top: 30%;    background: #bae6fd; animation: floatUp 3.2s infinite ease-in-out; }
        .b7  { right: 3%; top: 32%;    background: #fecaca; animation: floatUpAlt 3.6s infinite ease-in-out; }
        .b8  { left: 10%; top: 60%;    background: var(--pastel-yellow); animation: floatUp 4s infinite ease-in-out; opacity: 0.7; }
        .b9  { right: 10%;top: 65%;    background: var(--pastel-pink);   animation: floatUpAlt 3s infinite ease-in-out; opacity: 0.7; }
        .b10 { left: 3%;  bottom: 28%; background: #c4b5fd; animation: swayRight 3.6s infinite ease-in-out; }
        .b11 { right: 2%; bottom: 30%; background: #a7f3d0; animation: swayLeft 3.4s infinite ease-in-out; }
        .b12 { left: 15%; top: 3%;     background: #fda4af; animation: floatUp 4.8s infinite ease-in-out; opacity: 0.65; }
        .b13 { right: 14%;top: 5%;     background: #d8b4fe; animation: floatUpAlt 4.4s infinite ease-in-out; opacity: 0.65; }

        /* Small balloons */
        .balloon-sm {
            width: 26px; height: 32px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.55;
        }
        .balloon-sm::after {
            content: "│"; font-size: 6px;
            position: absolute; bottom: -7px; left: 11px;
            color: rgba(0,0,0,0.08);
        }
        .bs1 { left: 20%; bottom: 5%;  background: #fde68a; animation: floatUp 4s infinite ease-in-out; }
        .bs2 { right: 20%;bottom: 6%;  background: #fbcfe8; animation: floatUpAlt 3.6s infinite ease-in-out; }
        .bs3 { left: 25%; top: 15%;    background: #bbf7d0; animation: swayLeft 3.2s infinite ease-in-out; }
        .bs4 { right: 22%;top: 18%;    background: #bae6fd; animation: swayRight 3.8s infinite ease-in-out; }

        /* Party hats */
        .party-hat {
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 28px solid #fdba74;
        }
        .h1 { left: 8%;  top: 45%; transform: rotate(15deg);  animation: swayLeft 3.4s infinite ease-in-out; }
        .h2 { right: 8%; top: 50%; transform: rotate(-20deg); border-bottom-color: #c084fc; animation: swayRight 3.8s infinite ease-in-out; }
        .h3 { left: 18%; bottom: 18%; transform: rotate(10deg); border-bottom-color: #f9a8d4; animation: floatUp 4s infinite ease-in-out; opacity: 0.6; }

        /* Stars */
        .star { font-size: 1.4rem; color: var(--pastel-yellow); }
        .s1 { left: 14%;  top: 25%;    animation: swayLeft 2.6s infinite ease-in-out; }
        .s2 { right: 15%; bottom: 30%; animation: swayRight 3s infinite ease-in-out; }
        .s3 { left: 22%;  top: 5%;     animation: twinkle 1.6s infinite ease-in-out; font-size: 1.1rem; }
        .s4 { right: 20%; top: 8%;     animation: twinkle 2s infinite ease-in-out 0.4s; font-size: 1rem; }
        .s5 { left: 8%;   bottom: 40%; animation: twinkle 1.8s infinite ease-in-out 0.5s; font-size: 1.2rem; }
        .s6 { right: 6%;  bottom: 45%; animation: twinkle 2.2s infinite ease-in-out 0.3s; font-size: 1rem; }
        .s7 { left: 30%;  bottom: 3%;  animation: twinkle 1.6s infinite ease-in-out 0.6s; font-size: 1.3rem; }
        .s8 { right: 28%; bottom: 4%;  animation: twinkle 2s infinite ease-in-out 0.8s; font-size: 1.1rem; }

        /* Floating emojis */
        .emoji-float {
            position: absolute; font-size: 1.3rem;
            opacity: 0.5; pointer-events: none;
        }
        .ef1 { left: 5%;   top: 18%;    animation: floatUp 3.6s infinite ease-in-out; }
        .ef2 { right: 6%;  top: 22%;    animation: floatUpAlt 4s infinite ease-in-out; }
        .ef3 { left: 12%;  bottom: 15%; animation: floatUp 4.4s infinite ease-in-out; }
        .ef4 { right: 12%; bottom: 18%; animation: floatUpAlt 3.2s infinite ease-in-out; }

        /* ── Extra decorations clustered nearer the card (mid zone) ── */
        /* More large balloons */
        .b14 { left: 28%; top: 12%;    background: #f0abfc; animation: floatUp 3.4s infinite ease-in-out; }
        .b15 { right: 27%;top: 14%;    background: #93c5fd; animation: floatUpAlt 3.8s infinite ease-in-out; }
        .b16 { left: 30%; bottom: 12%; background: #fcd34d; animation: swayLeft 3.6s infinite ease-in-out; }
        .b17 { right: 29%;bottom: 14%; background: #86efac; animation: swayRight 3.2s infinite ease-in-out; }
        .b18 { left: 33%; top: 40%;    background: #fca5a5; animation: floatUp 4s infinite ease-in-out; opacity: 0.7; }
        .b19 { right: 32%;top: 44%;    background: #c4b5fd; animation: floatUpAlt 3.6s infinite ease-in-out; opacity: 0.7; }
        .b20 { left: 35%; top: 75%;    background: #fbcfe8; animation: swayRight 3.4s infinite ease-in-out; opacity: 0.7; }
        .b21 { right: 34%;top: 78%;    background: #a5f3fc; animation: swayLeft 3.8s infinite ease-in-out; opacity: 0.7; }

        /* More small balloons — mid zone */
        .bs5 { left: 32%; top: 25%;    background: #fef08a; animation: floatUpAlt 3s infinite ease-in-out; }
        .bs6 { right: 31%;top: 28%;    background: #ddd6fe; animation: floatUp 3.4s infinite ease-in-out; }
        .bs7 { left: 34%; bottom: 25%; background: #bbf7d0; animation: swayLeft 3.2s infinite ease-in-out; }
        .bs8 { right: 33%;bottom: 28%; background: #fecdd3; animation: swayRight 3.6s infinite ease-in-out; }

        /* More party hats — mid zone */
        .h4 { left: 26%; top: 60%; transform: rotate(-12deg); border-bottom-color: #67e8f9; animation: swayRight 3.4s infinite ease-in-out; opacity: 0.7; }
        .h5 { right: 25%;top: 30%; transform: rotate(18deg);  border-bottom-color: #fca5a5; animation: swayLeft 3.8s infinite ease-in-out; opacity: 0.7; }

        /* More stars & sparkles — mid zone */
        .s9  { left: 29%; top: 33%;    animation: twinkle 1.6s infinite ease-in-out 0.2s; font-size: 1.1rem; }
        .s10 { right: 28%;top: 55%;    animation: twinkle 2s infinite ease-in-out 0.7s; font-size: 1.2rem; }
        .s11 { left: 31%; bottom: 38%; animation: twinkle 1.8s infinite ease-in-out 0.5s; font-size: 1rem; }
        .s12 { right: 30%;bottom: 40%; animation: twinkle 2.2s infinite ease-in-out 0.9s; font-size: 1.3rem; }
        .s13 { left: 40%; top: 6%;     animation: twinkle 1.6s infinite ease-in-out 0.4s; font-size: 1rem; }
        .s14 { right: 40%;bottom: 6%;  animation: twinkle 2s infinite ease-in-out 0.6s; font-size: 1.1rem; }

        /* More floating emojis — mid zone */
        .ef5 { left: 27%; top: 50%;    animation: floatUp 3.4s infinite ease-in-out; }
        .ef6 { right: 26%;top: 68%;    animation: floatUpAlt 3.8s infinite ease-in-out; }
        .ef7 { left: 38%; bottom: 20%; animation: floatUp 4s infinite ease-in-out; }
        .ef8 { right: 38%;top: 20%;    animation: floatUpAlt 3.2s infinite ease-in-out; }

        /* ── RSVP Card ── */
        .party-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            border-radius: 28px;
            box-shadow:
                0 8px 32px rgba(219, 39, 119, 0.08),
                0 2px 8px rgba(56, 189, 248, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            width: 92%;
            max-width: 440px;
            padding: 32px 28px;
            box-sizing: border-box;
            z-index: 10;
            position: relative;
            border: 2px solid rgba(251, 207, 232, 0.45);
            margin: 24px auto;
        }

        @media (max-width: 520px) {
            .party-card {
                margin: 40px auto 60px auto;
                background: rgba(255, 255, 255, 0.68);
                padding: 24px 20px;
            }
        }

        .party-card::-webkit-scrollbar { width: 4px; }
        .party-card::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .one-badge {
            background: linear-gradient(135deg, #f9a8d4, #c084fc);
            color: #fff;
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 700;
            width: 68px;
            height: 68px;
            line-height: 68px;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: block;
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.3);
            animation: gentlePulse 3s infinite ease-in-out;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            background: linear-gradient(135deg, #7c3aed, #db2777, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: #64748b;
            margin: 0 0 14px 0;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* Inline SVG icon — aligns with emoji on neighbouring lines */
        .detail-ico {
            vertical-align: -3px;
            margin-right: 1px;
        }

        /* ── Party details box ── */
        .party-details {
            background: linear-gradient(135deg, rgba(240, 249, 255, 0.65), rgba(251, 207, 232, 0.3));
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #475569;
            border: 1px solid rgba(251, 207, 232, 0.3);
        }

        .party-details a {
            color: #7c3aed;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1.5px dashed rgba(124, 58, 237, 0.4);
            transition: border-color 0.2s;
        }
        .party-details a:hover {
            border-bottom-color: #7c3aed;
        }

        .map-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            padding: 5px 12px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border-radius: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.2);
        }
        .map-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.88rem;
            color: #7c3aed;
            letter-spacing: 0.01em;
        }

        input[type="text"], select {
            width: 100%;
            font-family: var(--font-body);
            background-color: rgba(248, 250, 252, 0.85);
            border: 2px solid rgba(226, 232, 240, 0.8);
            color: var(--text-color);
            padding: 11px 12px;
            font-size: 0.95rem;
            border-radius: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #a78bfa;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
        }

        input::placeholder {
            color: #a3b1c6;
            font-style: italic;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ── Button ── */
        button {
            width: 100%;
            font-family: var(--font-display);
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: white;
            border: none;
            padding: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 6px;
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25);
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }

        button:hover {
            background: linear-gradient(135deg, #6d28d9, #be185d);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        /* ── Response message ── */
        #sysResponse {
            margin-top: 14px;
            display: none;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 600;
            color: #7c3aed;
            padding: 14px;
            background: linear-gradient(135deg, rgba(240, 249, 255, 0.5), rgba(233, 213, 255, 0.4));
            border-radius: 14px;
            font-size: 0.92rem;
            border: 1px solid rgba(167, 139, 250, 0.2);
            line-height: 1.5;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 18px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.82rem;
            color: #94a3b8;
            letter-spacing: 0.01em;
        }

        /* ── Divider between header and form ── */
        .card-divider {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.3), rgba(219, 39, 119, 0.2), transparent);
            margin: 18px 0;
        }

        /* ── Burst confetti ── */
        .burst-confetti {
            position: fixed;
            width: 10px; height: 10px;
            border-radius: 2px;
            z-index: 1000;
            pointer-events: none;
            animation: burstFall 2.5s ease-out forwards;
        }

        /* ── Accessibility ── */
        @media (prefers-reduced-motion: reduce) {
            .confetti, .decor-item, .burst-confetti, .balloon-sm, .emoji-float, .star, .one-badge {
                animation: none !important;
                opacity: 0.5;
            }
        }
    </style>
</head>

<!-- RSVP Card -->
<div class="party-card">
    <div class="header">
        <span class="one-badge">1</span>
        <h1>Our Little Boy Saarth<br>is Turning One!</h1>
        <p class="subtitle">You're invited to celebrate with us 🎉</p>
        <div class="party-details">
            📍 <strong>Where:</strong> <a href="https://maps.app.goo.gl/wcpAz48rbvpB59iU6" target="_blank" rel="noopener">Saravanaa Bhavan, 8701, 120 St, Delta</a><br>
<svg class="detail-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5" fill="#fff" stroke="#db2777" stroke-width="1.6"/><path d="M3 9 h18" stroke="#db2777" stroke-width="1.6"/><path d="M8 2.5 v4 M16 2.5 v4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/></svg> <strong>When:</strong> Monday, Sept 7th<br>
            ⏰ <strong>Time:</strong> 12:00 PM<br>
            </a>
        </div>
    </div>

    <hr class="card-divider">

    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g., Jane Smith" required>
    </div>

    <div class="form-group">
        <label for="status">Can You Make It?</label>
        <select id="status" required>
            <option value="Attending">Yes, absolutely! 🥳</option>
            <option value="Declined">Sorry, can't make it 😢</option>
        </select>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="adults">Adults</label>
            <select id="adults">
                <option value="0">0</option>
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4+">4+</option>
            </select>
        </div>
        <div class="form-group">
            <label for="kids">Kids</label>
            <select id="kids">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4+">4+</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="ages">Ages of Kids <span style="font-weight:400; color:#94a3b8;">(for restaurant pricing)</span></label>
        <input type="text" id="ages" placeholder="e.g., 2, 5 — leave blank if none">
    </div>

    <button type="button" id="submitBtn" onclick="transmitToGoogle()">Save My RSVP ✨</button>

    <div id="sysResponse"></div>

    <div class="footer">
        Can't wait to celebrate together! 🎈🎂
    </div>
</div>

<script>
// ── Ambient confetti ──
(function createAmbientConfetti() {
    const canvas = document.getElementById('confettiCanvas');
    const colors = ['#fbcfe8','#fef08a','#bbf7d0','#e9d5ff','#fed7aa','#bae6fd','#fecaca','#c4b5fd','#a7f3d0','#fda4af'];
    const shapes = ['circle','square','ribbon'];
    const count = 35;

    for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const size = 4 + Math.random() * 7;
        const fallDuration = 7 + Math.random() * 12;
        const driftDuration = 3 + Math.random() * 5;
        const delay = Math.random() * fallDuration;

        piece.className = `confetti ${shape}`;
        piece.style.cssText = `
            left: ${left}%;
            width: ${shape === 'ribbon' ? size * 0.5 : size}px;
            height: ${shape === 'ribbon' ? size * 1.8 : size}px;
            background: ${color};
            animation-duration: ${fallDuration}s, ${driftDuration}s;
            animation-delay: -${delay}s, -${delay * 0.5}s;
        `;
        canvas.appendChild(piece);
    }
})();

// ── Celebration burst ──
function fireCelebrationBurst() {
    const colors = ['#f472b6','#facc15','#4ade80','#a78bfa','#fb923c','#38bdf8','#f87171'];
    for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'burst-confetti';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = 40 + Math.random() * 20 + '%';
        piece.style.top = 30 + Math.random() * 10 + '%';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDelay = (Math.random() * 0.6) + 's';
        piece.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3500);
    }
}

function transmitToGoogle() {
    const btn = document.getElementById('submitBtn');
    const respDiv = document.getElementById('sysResponse');

    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzZh7nWttbN89n6MHGEgq42vooaFdrfKKJZ8CvDRO99OqKCn8M5FPT2fFOqlpd5sjCgbw/exec";
    const payload = {
        name: document.getElementById('name').value,
        status: document.getElementById('status').value,
        adults: document.getElementById('adults').value,
        kids: document.getElementById('kids').value,
        ages: document.getElementById('ages').value
    };

    if (!payload.name || payload.name.trim() === "") {
        alert("Please enter your name so we know who is coming! 😊");
        return;
    }

    fetch(googleScriptUrl, {
        method: "POST",
        mode: "no-cors",
        cache: "no-cache",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).catch(err => console.error("RSVP background send error:", err));

    btn.style.display = "none";
    respDiv.style.display = "block";

    if (payload.status === "Declined") {
        respDiv.innerHTML = "&#128148; We'll miss you! Thanks for letting us know. Hope to see you soon! 🤗";
    } else {
        respDiv.innerHTML = "✨ Thank you! Your RSVP has been saved. See you at the celebration! 🎂";
        fireCelebrationBurst();
    }
}

// ── Let people change their mind ──
document.getElementById('status').addEventListener('change', function() {
    const btn = document.getElementById('submitBtn');
    const respDiv = document.getElementById('sysResponse');
    if (btn.style.display === 'none') {
        btn.style.display = '';
        btn.disabled = false;
        btn.innerText = 'Update My RSVP ✨';
        respDiv.style.display = 'none';
    }
});
</script>

</body>
</html>
